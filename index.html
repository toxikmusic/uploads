<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>toxikCloud</title>

  <style>
    .btn {
      max-height: 200px;
      max-width: 200px;
    }

    #loadingScreen {
      position: fixed;
      left: 0;
      top: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      color: white;
      font-size: 20px;
    }

    .spinner {
      border: 8px solid rgba(0, 0, 0, 0.1);
      border-top: 8px solid white;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #121212;
      margin: 0;
      z-index: 1;
    }

    a {
      text-decoration: none;
    }

    .glow-item {
      background-color: #ffffff;
      padding: 20px 40px;
      border-radius: 10px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      color: red;
      cursor: pointer;
      transition: box-shadow 0.3s ease, transform 0.3s ease;
    }

    .glow-item:hover {
      box-shadow: 0 0 20px 5px rgba(250, 0, 0, 0.5), 0 0 40px 10px rgba(212, 13, 136, 0.6);
      transform: scale(1.1);
    }

    .upload-box {
      border: white solid 3px;
      height: 70vH;
      width: 60vH;
      background-color: none;
      color: maroon;
      position: relative;
      margin: auto;
      text-align: center;
    }

    .text-description {
      position: sticky;
      max-width: 150px;
      max-height: 150px;
    }

    .inputfile {
      border: white solid 4px;
    }

    /* Sidebar Styles */
    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      height: 100%;
      width: 250px;
      background-color: #333;
      color: white;
      transform: translateX(-100%);
      transition: transform 0.3s ease-in-out;
      overflow-y: auto;
      z-index: 3;
    }

    .sidebar.active {
      transform: translateX(0);
    }

    .sidebar .menu {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .sidebar .menu li {
      border-bottom: 1px solid #444;
    }

    .sidebar .menu li a {
      text-decoration: none;
      color: white;
      display: block;
      padding: 15px;
      font-size: 18px;
      transition: background 0.3s;
    }

    .sidebar .menu li a:hover {
      background-color: #575757;
    }

    /* Submenu Styles */
    .submenu {
      display: none;
      list-style: none;
      padding-left: 20px;
      margin: 0;
    }

    .submenu li a {
      font-size: 16px;
      padding: 10px 15px;
    }

    .submenu li a:hover {
      background-color: #666;
    }

    .menu li.active .submenu {
      display: block;
    }

    /* Toggle Button */
    .toggle-btn {
      position: absolute;
      top: 20px;
      left: 20px;
      font-size: 24px;
      cursor: pointer;
      background-color: #333;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
      z-index: 3;
    }

    .toggle-btn:hover {
      background-color: hsl(0, 4%, 51%);
    }

    p {
      margin-top: 25px;
      color: red;
      text-align: center;
    }
  </style>
</head>

<body>
  <button class="toggle-btn" id="toggleBtn">Menu</button>

  <!-- Sidebar -->
  <nav class="sidebar" id="sidebar">
    <ul class="menu">
      <li><a href="http://vault.toxikmusic.com/">Home</a></li>
      <li><a href="http://toxikmusic.com/">TOXIKMUSIC</a></li>
      <li><a href="http://chat.toxikmusic.com">Chat app</a></li>
      <li><a href="http://traxx.club/">Traxx (music social media app)</a></li>
    </ul>
  </nav>

  <div class="upload-box">
    <form id="uploadForm" enctype="multipart/form-data">
      <input type="file" id="fileInput" name="file" required><br>
      <label for="descriptionInput">Enter a description:</label><br>
      <textarea id="descriptionInput" rows="4" cols="20" placeholder="Enter a text description here" name="description" required></textarea><br>

      <label for="folderSelect">Choose upload folder:</label><br>
      <select id="folderSelect" name="folder" required>
        <option value="">Main Folder</option>
        <option value="beats">Beats Folder</option>
      </select><br><br>

      <button type="submit" class="btn">Upload</button>
    </form>
  </div>

  <a href="./uploads">
    <div class="glow-item" style="height:100px; width: 200px; position: sticky;">Uploads</div>
  </a><br>
  <div><span>Toxikmusic's filecloud</span></div><br>

  <div id="loadingScreen" style="display: none;">
    <div class="spinner"></div>
    <p>Uploading...</p>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('uploadForm');
      const loadingScreen = document.getElementById('loadingScreen');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        loadingScreen.style.display = 'flex';

        const formData = new FormData();
        const fileInput = document.getElementById('fileInput');
        const descriptionInput = document.getElementById('descriptionInput');
        const folderSelect = document.getElementById('folderSelect');

        if (fileInput.files.length === 0) {
          alert("Please select a file.");
          loadingScreen.style.display = 'none';
          return;
        }

        formData.append('file', fileInput.files[0]);
        formData.append('description', descriptionInput.value);
        formData.append('folder', folderSelect.value);

        try {
          const response = await fetch('/upload', {
            method: 'POST',
            body: formData
          });

          if (!response.ok) {
            const errorText = await response.text();
            throw new Error(errorText);
          }

          const result = await response.json();
          alert(`File uploaded successfully! Access it here: ${result.fileUrl || 'uploads page'}`);
        } catch (error) {
          console.error('Error uploading file:', error);
          alert('Upload failed.');
        } finally {
          loadingScreen.style.display = 'none';
        }
      });

      // Sidebar toggle
      const toggleBtn = document.getElementById('toggleBtn');
      const sidebar = document.getElementById('sidebar');

      toggleBtn.addEventListener('click', function () {
        sidebar.classList.toggle('active');
      });
    });
  </script>
</body>
</html>
